name: Fond
description: 'Fond (formerly AnyPerk) is a U.S. employee rewards and recognition platform that lets
  companies run customizable recognition programs combining monetary and non-monetary rewards, perks,
  and a global rewards catalog. Fond offers a gated public/provider API that allows authenticated
  partners to programmatically manage a Fond account — provisioning, employee roster management,
  giving recognition to one or more employees, and rewards redemption — alongside integrations for
  Workday, ADP, Namely, Salesforce, Slack, and other HR systems. There is no open developer portal or
  published OpenAPI; API access is arranged directly via integration@fond.co. Fond was acquired by
  Reward Gateway in March 2023 and fond.co now redirects to rewardgateway.com. Originally added to the
  API Evangelist network as a portfolio lead of DCM Ventures.'
